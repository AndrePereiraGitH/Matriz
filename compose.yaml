services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=file:/data/matriz.db
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - sqlite-data:/data
    networks:
      - matriz-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/auth/me').then((r) => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "${WEB_PORT:-5173}:80"
    environment:
      - API_UPSTREAM=http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - matriz-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  matriz-net:
    driver: bridge

volumes:
  sqlite-data:
