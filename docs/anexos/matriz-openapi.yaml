openapi: 3.1.0
info:
  title: Matriz API
  version: 1.0.0
  summary: API REST de gestão de projetos e tarefas
  description: |
    Exemplo pedagógico para a Aula 02 — Arquitetura e Prototipagem.

    A especificação documenta recursos, contratos JSON, validações,
    autenticação e códigos de resposta. **Não implementa** o servidor.

    Regras de negócio assumidas para o exemplo:
    - O utilizador autenticado é o proprietário dos projetos que cria.
    - O acesso aos projetos e respetivas tarefas exige autorização.
    - As tarefas pertencem a um único projeto e admitem vários responsáveis.
    - Uma tarefa só pode ser atribuída uma vez a cada utilizador.
    - Os identificadores são inteiros positivos, alinhados com o modelo ER.
  contact:
    name: Equipa Matriz (exemplo académico)
servers:
  - url: https://api.exemplo.pt/v1
    description: Endereço ilustrativo — não corresponde a uma API ativa
  - url: http://localhost:8080/api/v1
    description: Ambiente local (após implementação)
tags:
  - name: Utilizadores
    description: Dados do utilizador autenticado
  - name: Projetos
    description: Gestão de projetos
  - name: Tarefas
    description: Gestão de tarefas de um projeto
  - name: Comentários
    description: Comentários associados às tarefas
  - name: Atribuições
    description: Associação N:M entre utilizadores e tarefas
security:
  - bearerAuth: []

paths:
  /users/me:
    get:
      tags: [Utilizadores]
      summary: Consultar o perfil autenticado
      operationId: getCurrentUser
      responses:
        '200':
          description: Perfil do utilizador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 7
                name: Ana Silva
                email: ana.silva@example.org
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projetos]
      summary: Listar projetos acessíveis ao utilizador
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Filtrar pelo nome do projeto
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: Matriz
      responses:
        '200':
          description: Lista paginada de projetos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projetos]
      summary: Criar um projeto
      description: O proprietário é inferido a partir do token de autenticação.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
            example:
              name: Matriz
              description: Plataforma de gestão de projetos e tarefas
      responses:
        '201':
          description: Projeto criado
          headers:
            Location:
              description: Caminho do recurso criado
              schema:
                type: string
              example: /api/v1/projects/12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: 12
                name: Matriz
                description: Plataforma de gestão de projetos e tarefas
                ownerId: 7
                createdAt: '2026-10-20T10:00:00Z'
                updatedAt: '2026-10-20T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projetos]
      summary: Consultar um projeto
      operationId: getProject
      responses:
        '200':
          description: Projeto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projetos]
      summary: Atualizar parcialmente um projeto
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
            example:
              name: Matriz 2.0
      responses:
        '200':
          description: Projeto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Projetos]
      summary: Eliminar um projeto
      description: No exemplo, elimina também as tarefas e comentários dependentes.
      operationId: deleteProject
      responses:
        '204':
          description: Projeto eliminado, sem corpo de resposta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tarefas]
      summary: Listar tarefas de um projeto
      operationId: listProjectTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Filtrar por estado
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          description: Filtrar por prioridade
          schema:
            $ref: '#/components/schemas/TaskPriority'
      responses:
        '200':
          description: Lista paginada de tarefas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tarefas]
      summary: Criar uma tarefa num projeto
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
            example:
              title: Criar protótipo da interface
              description: Preparar os ecrãs principais da aplicação
              status: TODO
              priority: HIGH
      responses:
        '201':
          description: Tarefa criada
          headers:
            Location:
              description: Caminho do recurso criado
              schema:
                type: string
              example: /api/v1/tasks/35
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 35
                projectId: 12
                title: Criar protótipo da interface
                description: Preparar os ecrãs principais da aplicação
                status: TODO
                priority: HIGH
                createdAt: '2026-10-20T10:20:00Z'
                updatedAt: '2026-10-20T10:20:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tarefas]
      summary: Consultar uma tarefa
      operationId: getTask
      responses:
        '200':
          description: Tarefa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tarefas]
      summary: Atualizar parcialmente uma tarefa
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
            example:
              status: IN_PROGRESS
              priority: MEDIUM
      responses:
        '200':
          description: Tarefa atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Tarefas]
      summary: Eliminar uma tarefa
      description: Remove também os comentários e as atribuições da tarefa.
      operationId: deleteTask
      responses:
        '204':
          description: Tarefa eliminada, sem corpo de resposta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comentários]
      summary: Listar comentários de uma tarefa
      operationId: listTaskComments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de comentários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comentários]
      summary: Adicionar um comentário a uma tarefa
      description: O autor é identificado através do token de autenticação.
      operationId: createTaskComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComment'
            example:
              content: O protótipo inicial está pronto para revisão.
      responses:
        '201':
          description: Comentário criado
          headers:
            Location:
              description: Caminho lógico do comentário criado
              schema:
                type: string
              example: /api/v1/tasks/35/comments/88
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              example:
                id: 88
                taskId: 35
                authorId: 7
                content: O protótipo inicial está pronto para revisão.
                createdAt: '2026-10-20T11:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{taskId}/assignments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Atribuições]
      summary: Listar os utilizadores atribuídos a uma tarefa
      operationId: listTaskAssignments
      responses:
        '200':
          description: Atribuições da tarefa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/assignments/{userId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Atribuições]
      summary: Atribuir um utilizador a uma tarefa
      description: |
        Operação idempotente: se a atribuição já existir, é devolvida sem
        criar um duplicado. Só utilizadores autorizados podem gerir atribuições.
      operationId: assignUserToTask
      responses:
        '200':
          description: Atribuição já existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
        '201':
          description: Atribuição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
              example:
                taskId: 35
                userId: 9
                assignedAt: '2026-10-20T11:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Atribuições]
      summary: Remover a atribuição de um utilizador
      operationId: unassignUserFromTask
      responses:
        '204':
          description: Atribuição removida, sem corpo de resposta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso JWT enviado no cabeçalho Authorization

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador do projeto
      schema:
        type: integer
        minimum: 1
      example: 12
    TaskId:
      name: taskId
      in: path
      required: true
      description: Identificador da tarefa
      schema:
        type: integer
        minimum: 1
      example: 35
    UserId:
      name: userId
      in: path
      required: true
      description: Identificador do utilizador
      schema:
        type: integer
        minimum: 1
      example: 9
    Page:
      name: page
      in: query
      required: false
      description: Página a consultar (começa em 1)
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Número máximo de resultados por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  responses:
    BadRequest:
      description: Pedido malformado ou parâmetros inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: O parâmetro page deve ser um inteiro positivo.
    Unauthorized:
      description: Credenciais de autenticação em falta ou inválidas
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: É necessário fornecer um token de acesso válido.
    Forbidden:
      description: Utilizador autenticado sem autorização para a operação
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Não tem permissão para aceder a este recurso.
    NotFound:
      description: Recurso inexistente
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: O recurso solicitado não foi encontrado.
    UnprocessableEntity:
      description: Dados bem formados, mas inválidos segundo as regras de validação
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            detail: Existem erros de validação.
            errors:
              - field: name
                message: O nome deve ter pelo menos 3 caracteres.

  schemas:
    User:
      type: object
      description: Representação pública de um utilizador
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          example: 7
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana.silva@example.org

    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, ownerId, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          example: 12
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Matriz
        description:
          type: string
          maxLength: 1000
          example: Aplicação de gestão de projetos e tarefas
        ownerId:
          type: integer
          minimum: 1
          readOnly: true
          description: FK lógica para User.id
          example: 7
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Task:
      type: object
      additionalProperties: false
      required: [id, projectId, title, description, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          example: 35
        projectId:
          type: integer
          minimum: 1
          readOnly: true
          description: FK lógica para Project.id
          example: 12
        title:
          type: string
          minLength: 3
          maxLength: 150
          example: Criar protótipo da interface
        description:
          type: string
          maxLength: 2000
          example: Preparar os ecrãs principais
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Comment:
      type: object
      additionalProperties: false
      required: [id, taskId, authorId, content, createdAt]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
        taskId:
          type: integer
          minimum: 1
          readOnly: true
          description: FK lógica para Task.id
        authorId:
          type: integer
          minimum: 1
          readOnly: true
          description: FK lógica para User.id
        content:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
          readOnly: true

    TaskAssignment:
      type: object
      description: Relação associativa entre Task e User (chave composta lógica)
      additionalProperties: false
      required: [taskId, userId, assignedAt]
      properties:
        taskId:
          type: integer
          minimum: 1
          description: Parte da chave composta; FK para Task.id
        userId:
          type: integer
          minimum: 1
          description: Parte da chave composta; FK para User.id
        assignedAt:
          type: string
          format: date-time
          readOnly: true

    TaskStatus:
      type: string
      description: Estado da tarefa
      enum: [TODO, IN_PROGRESS, DONE]
      example: TODO

    TaskPriority:
      type: string
      description: Prioridade da tarefa
      enum: [LOW, MEDIUM, HIGH]
      example: HIGH

    CreateProject:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          default: ''

    UpdateProject:
      type: object
      description: Pelo menos um campo tem de ser fornecido
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 1000

    CreateTask:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: string
          maxLength: 2000
          default: ''
        status:
          allOf:
            - $ref: '#/components/schemas/TaskStatus'
          default: TODO
        priority:
          allOf:
            - $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM

    UpdateTask:
      type: object
      description: Pelo menos um campo tem de ser fornecido
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    CreateComment:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          minimum: 0
          example: 42
        totalPages:
          type: integer
          minimum: 0
          example: 3

    ProjectList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    TaskList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    CommentList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    TaskAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignment'

    Problem:
      type: object
      description: Formato de erro inspirado no RFC 9457 (Problem Details)
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: name
                  message:
                    type: string
                    example: O nome deve ter pelo menos 3 caracteres.
