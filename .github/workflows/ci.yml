name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build application components
        run: npm run build

      - name: Run unit and integration tests
        run: npm test

  e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare local environment and database for E2E
        run: |
          cp apps/api/.env.example apps/api/.env
          npm run db:deploy -w @matriz/api
          npm run db:seed -w @matriz/api

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [verify, e2e]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t matriz-api:${{ github.sha }} .

      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t matriz-web:${{ github.sha }} .
