name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  docker-and-deploy:
    name: Build Docker Images & Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t matriz-api:${{ github.ref_name }} .

      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t matriz-web:${{ github.ref_name }} .

      - name: Build unified Render Docker image
        run: docker build -f Dockerfile -t matriz-render:${{ github.ref_name }} .

      - name: Trigger Render Deploy Hook (if configured)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
