openapi: 3.1.0
info:
  title: Matriz API
  version: 0.2.0
  summary: Contrato REST para o MVP da Ficha 03
  description: |
    Contrato para autenticação, projetos, tarefas, responsáveis, comentários
    e painel inicial. As operações protegidas requerem um utilizador
    autenticado e autorização sobre a equipa do projeto. Membros da equipa
    podem consultar e gerir tarefas, comentários e atribuições. O proprietário
    do projeto (utilizador que o criou) é o único que o pode editar ou eliminar.
    Os responsáveis elegíveis são membros da equipa do projeto.

    A autenticação usa uma sessão opaca persistida no SQLite e uma cookie
    HTTP-only com validade absoluta de oito horas. O token de sessão não é
    exposto em respostas nem armazenado em texto simples. Pedidos de escrita
    autenticados requerem o token CSRF devolvido no login ou em /auth/me.
    Registo público e recuperação de palavra-passe não fazem parte do MVP.
servers:
  - url: http://localhost:3000/api/v1
    description: Endereço local ilustrativo para desenvolvimento.
tags:
  - name: Autenticação
  - name: Equipas
  - name: Projetos
  - name: Tarefas
  - name: Responsáveis
  - name: Comentários
  - name: Painel

security:
  - sessionCookie: []

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão
      description: Credenciais de demonstração são criadas por seed.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão iniciada; a resposta inclui o utilizador autenticado.
          headers:
            Set-Cookie:
              description: |
                Cookie matriz_session com Path=/api/v1, HttpOnly, SameSite=Lax
                e Max-Age=28800. Secure é aplicado em produção.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Terminar sessão
      operationId: logout
      security:
        - sessionCookie: []
          csrfToken: []
      description: Requer o token CSRF recebido no login ou na consulta do perfil.
      responses:
        '204':
          description: Sessão terminada e cookie invalidado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Consultar o utilizador autenticado
      operationId: getCurrentUser
      responses:
        '200':
          description: |
            Perfil público, novo token CSRF (o anterior é invalidado) e
            instante de expiração absoluta da sessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /teams:
    get:
      tags: [Equipas]
      summary: Listar equipas disponíveis ao utilizador
      description: |
        Usado para escolher a equipa ao criar um projeto. Apenas são devolvidas
        equipas das quais o utilizador autenticado é membro.
      operationId: listTeams
      responses:
        '200':
          description: Equipas que o utilizador pode selecionar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dashboard:
    get:
      tags: [Painel]
      summary: Consultar projetos acessíveis e contagens de tarefas
      description: |
        As contagens são agregadas por estado para cada projeto acessível.
        A resposta inclui zero para estados sem tarefas.
      operationId: getDashboard
      responses:
        '200':
          description: Resumo do painel inicial.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardProject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projetos]
      summary: Listar projetos acessíveis
      operationId: listProjects
      parameters:
        - name: search
          in: query
          required: false
          description: Pesquisa por correspondência no nome do projeto.
          schema:
            type: string
      responses:
        '200':
          description:           Projetos de equipas onde o utilizador autenticado é membro, possivelmente lista vazia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Projetos]
      summary: Criar projeto
      description: |
        O projeto só pode ser criado numa equipa da qual o utilizador seja
        membro. O proprietário é inferido da sessão autenticada; campos como
        ownerId enviados pelo cliente são rejeitados.
      operationId: createProject
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Projeto criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projetos]
      summary: Consultar projeto
      description: Apenas membros da equipa do projeto podem consultar este recurso.
      operationId: getProject
      responses:
        '200':
          description: Projeto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projetos]
      summary: Editar projeto
      description: Apenas o proprietário do projeto pode editar os seus dados.
      operationId: updateProject
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Projeto atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Projetos]
      summary: Eliminar projeto
      description: |
        Apenas o proprietário pode eliminar o projeto. A eliminação é recusada
        se existirem tarefas dependentes.
      operationId: deleteProject
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Projeto eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tarefas]
      summary: Listar e filtrar tarefas do projeto
      description: Apenas membros da equipa do projeto podem consultar tarefas.
      operationId: listProjectTasks
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskPriority'
      responses:
        '200':
          description: Tarefas do projeto, possivelmente lista vazia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tarefas]
      summary: Criar tarefa no projeto
      description: Membros da equipa do projeto podem criar tarefas.
      operationId: createTask
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Tarefa criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tarefas]
      summary: Consultar tarefa
      description: Apenas membros da equipa do projeto podem consultar a tarefa.
      operationId: getTask
      responses:
        '200':
          description: Tarefa encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tarefas]
      summary: Editar tarefa
      description: Membros da equipa do projeto podem editar tarefas.
      operationId: updateTask
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Tarefas]
      summary: Eliminar tarefa
      description: Membros da equipa podem eliminar tarefas sem comentários ou atribuições.
      operationId: deleteTask
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Tarefa eliminada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/{taskId}/eligible-assignees:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Responsáveis]
      summary: Listar utilizadores elegíveis para a tarefa
      description: Apenas membros da equipa do projeto são elegíveis para atribuição.
      operationId: listEligibleAssignees
      responses:
        '200':
          description: Utilizadores elegíveis segundo a política aprovada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/assignees:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Responsáveis]
      summary: Listar responsáveis de uma tarefa
      description: Apenas membros da equipa do projeto podem consultar as atribuições.
      operationId: listTaskAssignees
      responses:
        '200':
          description: Responsáveis atualmente associados à tarefa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/assignees/{userId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    put:
      tags: [Responsáveis]
      summary: Associar responsável à tarefa
      description: |
        Membros da equipa podem gerir atribuições. Apenas utilizadores membros
        dessa equipa são elegíveis. A operação é idempotente.
      operationId: assignTaskUser
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Responsável associado ou associação já existente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Responsáveis]
      summary: Remover responsável da tarefa
      description: Membros da equipa do projeto podem remover atribuições.
      operationId: unassignTaskUser
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Associação removida; remoção repetida não altera o estado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comentários]
      summary: Listar comentários da tarefa
      description: Apenas membros da equipa do projeto podem consultar comentários.
      operationId: listTaskComments
      responses:
        '200':
          description: Comentários com autor e data de criação.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comentários]
      summary: Adicionar comentário à tarefa
      description: |
        Membros da equipa do projeto podem comentar. O autor e a data são
        definidos pelo sistema a partir da sessão e do servidor.
      operationId: createTaskComment
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Comentário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: matriz_session
      description: |
        Cookie de sessão opaca HTTP-only, válida por oito horas. O servidor
        guarda apenas SHA-256 do token. A cookie usa Path=/api/v1,
        SameSite=Lax e Secure em produção; o cliente não a deve definir.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token CSRF devolvido por /auth/login e /auth/me.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador CUID do projeto.
      schema:
        type: string
        minLength: 1
    TaskId:
      name: taskId
      in: path
      required: true
      description: Identificador CUID da tarefa.
      schema:
        type: string
        minLength: 1

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024

    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [user, csrfToken, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string
          description: Token opaco necessário nos pedidos autenticados de escrita.
        expiresAt:
          type: string
          format: date-time

    User:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
        email:
          type: string
          format: email

    Team:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string

    Project:
      type: object
      additionalProperties: false
      required: [id, teamId, ownerId, name]
      properties:
        id:
          type: string
          minLength: 1
        teamId:
          type: string
          minLength: 1
        ownerId:
          type: [string, 'null']
          description: Proprietário inferido da sessão na criação; null em projetos legados.
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Obrigatório, não pode conter apenas espaços e é aparado antes de guardar.
        description:
          type: [string, 'null']
          maxLength: 1000

    ProjectInput:
      type: object
      additionalProperties: false
      required: [teamId, name]
      properties:
        teamId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Se indicado, não pode conter apenas espaços e é aparado antes de guardar.
        description:
          type: [string, 'null']
          maxLength: 1000

    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 1000

    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]

    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    Task:
      type: object
      additionalProperties: false
      required: [id, projectId, title, status, priority]
      properties:
        id:
          type: string
          minLength: 1
        projectId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    TaskInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Obrigatório e não pode conter apenas espaços; é aparado antes de guardar.
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
          default: TODO
        priority:
          $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM

    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Se indicado, não pode conter apenas espaços e é aparado antes de guardar.
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    TaskCountsByStatus:
      type: object
      additionalProperties: false
      required: [TODO, IN_PROGRESS, DONE]
      properties:
        TODO:
          type: integer
          minimum: 0
        IN_PROGRESS:
          type: integer
          minimum: 0
        DONE:
          type: integer
          minimum: 0

    DashboardProject:
      type: object
      additionalProperties: false
      required: [project, taskCountsByStatus]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        taskCountsByStatus:
          $ref: '#/components/schemas/TaskCountsByStatus'

    TaskAssignment:
      type: object
      additionalProperties: false
      required: [user, assignedAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        assignedAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    Comment:
      type: object
      additionalProperties: false
      required: [id, taskId, author, content, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        taskId:
          type: string
          minLength: 1
        author:
          $ref: '#/components/schemas/User'
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Pedido malformado ou parâmetro inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Sessão inexistente, inválida ou expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Utilizador autenticado sem permissão segundo a política aprovada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Equipa, projeto, tarefa ou utilizador inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Operação incompatível com dependências ou estado atual do recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Pedido bem formado, mas com dados inválidos.
      content:
